<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Days Together</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: #141414;
      color: #fff;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      overflow: hidden;
    }
    .stars { position: fixed; inset: 0; pointer-events: none; }
    .star {
      position: absolute;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 0 3px #fff, 0 0 8px #fff, 0 0 16px rgba(255,255,255,.9);
      animation: twinkle var(--tw) ease-in-out infinite;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 1; }
      50% { opacity: .5; }
    }
    .wrap {
      position: relative;
      z-index: 1;
      width: 100%; height: 100%;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 5%;
    }
    .card { max-width: 560px; width: 100%; }
    .logo {
      width: min(72%, 280px);
      height: auto;
      display: block;
      margin: 0 auto 14px;
    }
    .since {
      font-size: clamp(14px, 3.3vmin, 20px);
      letter-spacing: .02em;
      line-height: 1.35;
    }
    .count {
      margin: 16px 0 6px;
      font-variant-numeric: tabular-nums;
      font-weight: 650;
      font-size: clamp(56px, 16vmin, 96px);
      line-height: .9;
      letter-spacing: -.04em;
    }
    .label {
      font-size: clamp(14px, 3.2vmin, 18px);
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    .break {
      margin-top: 16px;
      font-size: clamp(12px, 2.8vmin, 15px);
      color: #fff;
      letter-spacing: .04em;
    }
  </style>
</head>

      <div class="since">TOGETHER SINCE FIRE CONFERENCE IN PHILLY (July 15-17,2022)</div>
      <div class="count" id="days">—</div>
      <div class="label">days together</div>
      <div class="break" id="break"></div>
    </div>
  </div>
  <script>
    const START = new Date("2022-07-17T00:00:00-05:00");
    const TZ = "America/Chicago";
    const sky = document.getElementById("stars");
    for (let i = 0; i < 700; i++) {
      const s = document.createElement("i");
      s.className = "star";
      const size = Math.random() < 0.06 ? 3.2 : Math.random() < 0.22 ? 2.2 : 1.4;
      s.style.width = size + "px";
      s.style.height = size + "px";
      s.style.left = Math.random() * 100 + "%";
      s.style.top = Math.random() * 100 + "%";
      s.style.setProperty("--tw", (2.4 + Math.random() * 3.6).toFixed(2) + "s");
      sky.appendChild(s);
    }

    function ymd(date) {
      const fmt = new Intl.DateTimeFormat("en-CA", {
        timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit"
      });
      const [y, m, d] = fmt.format(date).split("-").map(Number);
      return { y, m, d };
    }

    function diffYMD(from, to) {
      let years = to.y - from.y;
      let months = to.m - from.m;
      let days = to.d - from.d;
      if (days < 0) {
        months -= 1;
        const prev = new Date(Date.UTC(to.y, to.m - 1, 0)).getUTCDate();
        days += prev;
      }
      if (months < 0) { years -= 1; months += 12; }
      return { years, months, days };
    }

    function tick() {
      const now = new Date();
      const totalDays = Math.max(0, Math.floor((now - START) / 86400000));
      document.getElementById("days").textContent = totalDays.toLocaleString("en-US");
      const d = diffYMD({ y: 2022, m: 7, d: 17 }, ymd(now));
      const bit = (n, one, many) => n + " " + (n === 1 ? one : many);
      document.getElementById("break").textContent =
        bit(d.years, "year", "years") + "  ·  " +
        bit(d.months, "month", "months") + "  ·  " +
        bit(d.days, "day", "days");
    }
    function loop() { tick(); requestAnimationFrame(loop); }
    loop();
  </script>

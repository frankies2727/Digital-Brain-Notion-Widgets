name: Sync treadmill heatmap

on:
  workflow_dispatch:
  schedule:
    - cron: "15 12 * * *"
    - cron: "15 23 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull Notion rows
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: python3 scripts/sync-treadmill.py
      - name: Commit data file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add treadmill-data.json
          if git diff --cached --quiet; then
            echo "No treadmill changes"
          else
            git commit -m "chore: sync treadmill utilization heatmap"
            git push
          fi

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Orrery</title>
  <style>
    :root {
      --bg: #141414;
      --ink: #ececec;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      overflow: hidden;
    }
    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    .star {
      position: absolute;
      background: #fff;
      border-radius: 50%;
      box-shadow:
        0 0 3px #fff,
        0 0 8px #fff,
        0 0 16px rgba(255,255,255,.95),
        0 0 28px rgba(255,255,255,.55);
      animation: twinkle var(--tw) ease-in-out infinite;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 1; filter: brightness(1); }
      50% { opacity: .55; filter: brightness(1.8); }
    }
    .stage {
      width: 100%; height: 100%;
      display: grid;
      place-items: center;
      padding: 2%;
      position: relative;
      z-index: 1;
    }
    .clock {
      position: relative;
      width: min(92vmin, 100%);
      aspect-ratio: 1;
    }
    .ring {
      position: absolute;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      border: 1.5px solid #fff;
      border-radius: 50%;
      width: var(--r); height: var(--r);
    }
    .sun {
      position: absolute;
      left: 50%; top: 50%;
      width: 8.2%; height: 8.2%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #fff4c4, #f5c542 46%, #d97706 78%);
      box-shadow: 0 0 16px rgba(245,185,66,.4);
      z-index: 4;
    }
    .sun i {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      overflow: hidden;
    }
    .sun i::after {
      content: "";
      position: absolute;
      inset: -35%;
      background: conic-gradient(from 0deg, transparent 0 35%, rgba(255,255,255,.28) 48%, rgba(180,80,0,.2) 62%, transparent 80%);
      animation: spin 18s linear infinite;
    }
    .sun em {
      position: absolute;
      left: 50%;
      top: calc(100% + 4px);
      transform: translateX(-50%);
      font-style: normal;
      font-size: clamp(7px, 1.85vmin, 11px);
      letter-spacing: .03em;
      white-space: nowrap;
      color: var(--ink);
      text-shadow: 0 0 4px var(--bg), 0 0 8px var(--bg);
      line-height: 1;
    }
    .orbit {
      position: absolute;
      inset: 0;
      transform: rotate(var(--rot, 0deg));
    }
    .body {
      position: absolute;
      left: 50%;
      top: var(--y);
      width: var(--d);
      height: var(--d);
      margin-left: calc(var(--d) / -2);
      transform: translateY(-50%) rotate(calc(var(--rot, 0deg) * -1));
      z-index: 3;
    }
    .body em {
      position: absolute;
      left: 50%;
      bottom: calc(100% + 3px);
      transform: translateX(-50%);
      font-style: normal;
      font-size: clamp(7px, 1.85vmin, 11px);
      letter-spacing: .03em;
      white-space: nowrap;
      color: var(--ink);
      text-shadow: 0 0 4px var(--bg), 0 0 8px var(--bg);
      line-height: 1;
    }
    .body b {
      display: block;
      width: 100%; height: 100%;
      border-radius: 50%;
      background: var(--c);
      box-shadow: 0 0 0 1px rgba(255,255,255,.12);
      overflow: hidden;
      position: relative;
    }
    .body b::after {
      content: "";
      position: absolute;
      inset: -40%;
      background: conic-gradient(from 0deg, rgba(255,255,255,0) 0 40%, rgba(255,255,255,.28) 50%, rgba(0,0,0,.28) 62%, rgba(255,255,255,0) 78%);
      animation: spin var(--spin, 8s) linear infinite;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .body.saturn { overflow: visible; }
    .body.saturn::after {
      content: "";
      position: absolute;
      left: 50%; top: 50%;
      width: 168%; height: 38%;
      border: 1.6px solid rgba(232,201,132,.9);
      border-radius: 50%;
      transform: translate(-50%, -50%) rotate(-18deg);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="stars" id="stars"></div>
  <div class="stage">
    <div class="clock" id="clock"></div>
  </div>
  <script>
    const PLANETS = [
      { name: "Mercury", L0: 252.25032350, Ld: 149472.67411175, e0: 0.20563593, ed:  0.00001906, w0:  77.45779628, wd: 0.16047689, r: 22, d: 4.6, c: "#b7b3ad", spin: "11s" },
      { name: "Venus",   L0: 181.97909950, Ld:  58517.81538729, e0: 0.00677672, ed: -0.00004107, w0: 131.60246718, wd: 0.00268329, r: 34, d: 6.4, c: "#e2c07a", spin: "16s reverse" },
      { name: "Earth",   L0: 100.46457166, Ld:  35999.37244981, e0: 0.01671123, ed: -0.00004392, w0: 102.93768193, wd: 0.32327364, r: 46, d: 6.8, c: "#6ea8ff", spin: "6s" },
      { name: "Mars",    L0: 355.45332543, Ld:  19140.30268499, e0: 0.09339410, ed:  0.00007882, w0: 336.06023398, wd: 0.44441088, r: 58, d: 5.8, c: "#d0654a", spin: "6.2s" },
      { name: "Jupiter", L0:  34.39644051, Ld:   3034.74612775, e0: 0.04838624, ed: -0.00013253, w0:  14.72847983, wd: 0.21252668, r: 70, d: 10.4, c: "#d9a066", spin: "3s" },
      { name: "Saturn",  L0:  49.95434744, Ld:   1222.49362201, e0: 0.05386179, ed: -0.00050991, w0:  92.59887831, wd: 0.41897216, r: 82, d: 9.2, c: "#e6d19a", saturn: true, spin: "3.2s" },
      { name: "Uranus",  L0: 313.23810451, Ld:    428.48202785, e0: 0.04725744, ed: -0.00004397, w0: 170.95427630, wd: 0.40805281, r: 90, d: 7.2, c: "#8fd4d8", spin: "4.5s" },
      { name: "Neptune", L0: 304.87997044, Ld:    218.45945325, e0: 0.00859048, ed:  0.00005105, w0:  44.96476227, wd: 0.32241464, r: 97, d: 7.0, c: "#4f7dd4", spin: "4.8s" }
    ];

    const clock = document.getElementById("clock");
    PLANETS.forEach((p, i) => {
      const ring = document.createElement("div");
      ring.className = "ring";
      ring.style.setProperty("--r", p.r + "%");
      clock.appendChild(ring);

      const orbit = document.createElement("div");
      orbit.className = "orbit";
      orbit.id = "p" + i;
      const cls = "body" + (p.saturn ? " saturn" : "");
      const y = ((100 - p.r) / 2) + "%";
      orbit.innerHTML = `<div class="${cls}" style="--d:${p.d}%;--y:${y};--c:${p.c};--spin:${p.spin}" title="${p.name}"><b></b><em>${p.name}</em></div>`;
      clock.appendChild(orbit);
    });

    clock.insertAdjacentHTML("beforeend", `<div class="sun" title="Sun"><i></i><em>Sun</em></div>`);

    const sky = document.getElementById("stars");
    for (let i = 0; i < 700; i++) {
      const s = document.createElement("i");
      s.className = "star";
      const size = Math.random() < 0.06 ? 3.2 : Math.random() < 0.22 ? 2.2 : 1.4;
      s.style.width = size + "px";
      s.style.height = size + "px";
      s.style.left = (Math.random() * 100) + "%";
      s.style.top = (Math.random() * 100) + "%";
      s.style.opacity = "1";
      s.style.setProperty("--tw", (2.4 + Math.random() * 3.6).toFixed(2) + "s");
      sky.appendChild(s);
    }

    const norm = d => ((d % 360) + 360) % 360;

    function centuries(date) {
      const jd = date.getTime() / 86400000 + 2440587.5;
      return (jd - 2451545.0) / 36525;
    }

    function longitude(p, T) {
      const L = p.L0 + p.Ld * T;
      const e = p.e0 + p.ed * T;
      const w = p.w0 + p.wd * T;
      const M = norm(L - w) * Math.PI / 180;
      return norm(L + (2 * e * Math.sin(M) * 180 / Math.PI));
    }

    function tick() {
      const T = centuries(new Date());
      PLANETS.forEach((p, i) => {
        const lon = longitude(p, T);
        document.getElementById("p" + i).style.setProperty("--rot", (-lon) + "deg");
      });
    }

    function loop() { tick(); requestAnimationFrame(loop); }
    loop();
  </script>
</body>
</html>

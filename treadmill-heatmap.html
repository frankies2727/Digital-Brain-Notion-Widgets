<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Treadmill Heatmap</title>
  <style>
    :root {
      --bg: #141414;
      --ink: #e6edf3;
      --muted: #8b949e;
      --tile0: #21262d;
      --tile1: #0e4429;
      --tile2: #006d32;
      --tile3: #26a641;
      --tile4: #39d353;
      --card: #161b22;
      --line: #30363d;
      --tip-bg: #1c1c1c;
      --cell: 11px;
      --gap: 3px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: var(--bg); color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      overflow: hidden;
    }
    body.transparent { --bg: transparent; background: transparent; }
    body.light {
      --bg: #f4f1ea; --ink: #1b1b1b; --muted: #6b655c;
      --tile0: #ebedf0; --tile1: #9be9a8; --tile2: #40c463; --tile3: #30a14e; --tile4: #216e39;
      --card: #fffdf8; --line: #d9d1c4; --tip-bg: #fffdf8;
    }
    body.light.transparent { --bg: transparent; background: transparent; }
    .wrap { width: 100%; height: 100%; display: grid; place-items: center; padding: 10px 12px; }
    .board { width: min(100%, 920px); background: transparent; min-width: 0; }
    .head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
    .count { font-size: clamp(14px, 2.4vw, 18px); font-weight: 650; letter-spacing: -0.02em; }
    .count span { color: var(--muted); font-weight: 500; }
    .years { display: flex; gap: 6px; }
    .years button { border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 12px; font-weight: 650; padding: 4px 10px; border-radius: 6px; cursor: pointer; }
    .years button.on { background: #1f6feb; color: #fff; }
    body.light .years button.on { background: #0969da; }
    .graph { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 6px; align-items: start; min-width: 0; }
    .dows { display: grid; grid-template-rows: repeat(7, var(--cell)); gap: var(--gap); font-size: 10px; color: var(--muted); padding-top: 18px; }
    .dows span { display: flex; align-items: center; height: var(--cell); }
    .dows span.blank { visibility: hidden; }
    .grid-wrap {
      min-width: 0;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-x: contain;
      touch-action: pan-x;
      scrollbar-width: thin;
      scrollbar-color: var(--line) transparent;
    }
    .grid-wrap::-webkit-scrollbar { height: 6px; }
    .grid-wrap::-webkit-scrollbar-thumb { background: var(--line); border-radius: 99px; }
    .scroller { width: max-content; }
    .months { display: grid; grid-auto-flow: column; grid-auto-columns: var(--cell); gap: var(--gap); height: 16px; margin-bottom: 2px; font-size: 10px; color: var(--muted); }
    .weeks { display: grid; grid-auto-flow: column; grid-auto-columns: var(--cell); gap: var(--gap); }
    .week { display: grid; grid-template-rows: repeat(7, var(--cell)); gap: var(--gap); }
    .cell { width: var(--cell); height: var(--cell); border-radius: 2px; background: var(--tile0); }
    .cell.l1 { background: var(--tile1); }
    .cell.l2 { background: var(--tile2); }
    .cell.l3 { background: var(--tile3); }
    .cell.l4 { background: var(--tile4); }
    .cell.future { opacity: 0.28; }
    .foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 10px; color: var(--muted); font-size: 11px; }
    .hint { display: none; }
    .legend { display: flex; align-items: center; gap: 4px; }
    .legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; background: var(--tile0); }
    .legend i.l1 { background: var(--tile1); }
    .legend i.l2 { background: var(--tile2); }
    .legend i.l3 { background: var(--tile3); }
    .legend i.l4 { background: var(--tile4); }
    .tip { position: fixed; z-index: 9; pointer-events: none; background: var(--tip-bg); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; font-size: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.35); opacity: 0; transform: translate(-50%, calc(-100% - 8px)); white-space: nowrap; }
    .tip.on { opacity: 1; }
    @media (min-width: 720px) { :root { --cell: 13px; --gap: 3px; } }
    @media (max-width: 640px) {
      :root { --cell: 10px; --gap: 2px; }
      .hint { display: inline; }
      .foot { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="board">
      <div class="head">
        <div class="count" id="count">Loading treadmill days…</div>
        <div class="years" id="years"></div>
      </div>
      <div class="graph">
        <div class="dows">
          <span class="blank">Sun</span>
          <span>Mon</span>
          <span class="blank">Tue</span>
          <span>Wed</span>
          <span class="blank">Thu</span>
          <span>Fri</span>
          <span class="blank">Sat</span>
        </div>
        <div class="grid-wrap" id="gridWrap">
          <div class="scroller">
            <div class="months" id="months"></div>
            <div class="weeks" id="weeks"></div>
          </div>
        </div>
      </div>
      <div class="foot">
        <span id="meta">Treadmill Utilization</span>
        <span class="hint">swipe for the rest of the year →</span>
        <div class="legend">Less <i></i><i class="l1"></i><i class="l2"></i><i class="l3"></i><i class="l4"></i> More</div>
      </div>
    </div>
  </div>
  <div class="tip" id="tip"></div>
  <script>
    const TZ = "America/Chicago";
    const params = new URLSearchParams(location.search);
    if ((params.get("theme") || "dark") === "light") document.body.classList.add("light");
    if (params.get("bg") === "transparent") document.body.classList.add("transparent");
    const whoFilter = (params.get("who") || "frankie").toLowerCase();
    const FRANKIE = "4a463c93-3bc7-49ef-b1b1-fb8c5fe0618e";
    const CECI = "ce531e95-27f3-43be-8f40-8daecefe9c34";
    const ALIASES = { me: FRANKIE, frankie: FRANKIE, ceci: CECI };
    const FALLBACK = {
      updated: "2026-09-18T16:00:00-05:00",
      people: { [FRANKIE]: "Frankie", [CECI]: "Ceci" },
      entries: [
        { date: "2026-08-27", steps: 2100, who: CECI },
        { date: "2026-08-27", steps: 3000, who: FRANKIE },
        { date: "2026-08-28", steps: 3000, who: FRANKIE },
        { date: "2026-08-29", steps: 3000, who: FRANKIE },
        { date: "2026-08-30", steps: 3000, who: FRANKIE },
        { date: "2026-08-31", steps: 3000, who: FRANKIE },
        { date: "2026-09-01", steps: 3000, who: FRANKIE },
        { date: "2026-09-02", steps: 3000, who: FRANKIE },
        { date: "2026-09-03", steps: 3000, who: FRANKIE },
        { date: "2026-09-04", steps: 3000, who: FRANKIE },
        { date: "2026-09-06", steps: 3000, who: FRANKIE },
        { date: "2026-09-09", steps: 3000, who: FRANKIE },
        { date: "2026-09-13", steps: 3000, who: FRANKIE },
        { date: "2026-09-17", steps: 3000, who: FRANKIE }
      ]
    };
    function chicagoISO(d) {
      return new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" }).format(d);
    }
    function parseISO(s) {
      const [y, m, d] = s.split("-").map(Number);
      return new Date(Date.UTC(y, m - 1, d, 12));
    }
    function addDays(date, n) {
      const x = new Date(date.getTime());
      x.setUTCDate(x.getUTCDate() + n);
      return x;
    }
    function startOfWeekSunday(date) {
      const x = new Date(date.getTime());
      x.setUTCDate(x.getUTCDate() - x.getUTCDay());
      return x;
    }
    function level(steps) {
      if (!steps) return 0;
      if (steps < 1500) return 1;
      if (steps < 3000) return 2;
      if (steps < 4500) return 3;
      return 4;
    }
    function fmtNum(n) { return new Intl.NumberFormat("en-US").format(n || 0); }
    function niceDate(iso) {
      return parseISO(iso).toLocaleDateString("en-US", { timeZone: "UTC", weekday: "short", month: "short", day: "numeric", year: "numeric" });
    }
    function filterEntries(data) {
      const want = ALIASES[whoFilter] || (whoFilter === "all" ? null : whoFilter);
      return data.entries.filter((row) => {
        if (!row.date) return false;
        if (!want) return true;
        return String(row.who || "").includes(want);
      });
    }
    function totals(rows) {
      const byDay = {};
      for (const row of rows) byDay[row.date] = (byDay[row.date] || 0) + (Number(row.steps) || 0);
      return byDay;
    }
    function yearRange(year) {
      const end = parseISO(year + "-12-31");
      const start = parseISO(year + "-01-01");
      return { start: startOfWeekSunday(start), end: addDays(startOfWeekSunday(end), 6) };
    }
    const tip = document.getElementById("tip");
    function showTip(el, text) {
      const r = el.getBoundingClientRect();
      tip.textContent = text;
      tip.style.left = r.left + r.width / 2 + "px";
      tip.style.top = r.top + "px";
      tip.classList.add("on");
    }
    function hideTip() { tip.classList.remove("on"); }
    function scrollToToday(todayWeek) {
      const wrap = document.getElementById("gridWrap");
      if (!wrap || todayWeek < 0) return;
      const cell = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--cell")) || 11;
      const gap = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--gap")) || 3;
      const col = cell + gap;
      const target = Math.max(0, (todayWeek + 1) * col - wrap.clientWidth + 8);
      wrap.scrollLeft = target;
    }
    function paint(data, year) {
      const rows = filterEntries(data);
      const byDay = totals(rows);
      const today = chicagoISO(new Date());
      const { start, end } = yearRange(year);
      const weeksEl = document.getElementById("weeks");
      const monthsEl = document.getElementById("months");
      weeksEl.innerHTML = "";
      monthsEl.innerHTML = "";
      let cursor = new Date(start.getTime());
      let week = null;
      let weekIndex = -1;
      let todayWeek = -1;
      const monthAt = [];
      while (cursor <= end) {
        if (cursor.getUTCDay() === 0) {
          week = document.createElement("div");
          week.className = "week";
          weeksEl.appendChild(week);
          weekIndex += 1;
          monthAt[weekIndex] = cursor.getUTCMonth();
        }
        const iso = cursor.toISOString().slice(0, 10);
        const steps = byDay[iso] || 0;
        const cell = document.createElement("div");
        const lv = level(steps);
        cell.className = "cell" + (lv ? " l" + lv : "") + (iso > today ? " future" : "");
        if (iso === today) todayWeek = weekIndex;
        const label = steps ? fmtNum(steps) + " steps on " + niceDate(iso) : "No treadmill on " + niceDate(iso);
        cell.addEventListener("mouseenter", () => showTip(cell, label));
        cell.addEventListener("mouseleave", hideTip);
        week.appendChild(cell);
        cursor = addDays(cursor, 1);
      }
      let last = -1;
      monthAt.forEach((month) => {
        const tag = document.createElement("span");
        if (month !== last) {
          tag.textContent = "JanFebMarAprMayJunJulAugSepOctNovDec".slice(month * 3, month * 3 + 3);
          last = month;
        }
        monthsEl.appendChild(tag);
      });
      const days = Object.keys(byDay).filter((d) => d.startsWith(String(year)) && byDay[d] > 0);
      const stepSum = days.reduce((s, d) => s + byDay[d], 0);
      document.getElementById("count").innerHTML = fmtNum(stepSum) + " steps <span>in " + days.length + " treadmill days · " + year + "</span>";
      const whoLabel = whoFilter === "all" ? "everyone" : (whoFilter === "ceci" ? "Ceci" : "Frankie");
      document.getElementById("meta").textContent = "Treadmill Utilization · " + whoLabel + " · updates from Notion data file";
      requestAnimationFrame(() => scrollToToday(todayWeek >= 0 ? todayWeek : weekIndex));
    }
    async function load() {
      try {
        const res = await fetch("./treadmill-data.json?ts=" + Date.now(), { cache: "no-store" });
        if (!res.ok) throw new Error("missing json");
        return await res.json();
      } catch (e) {
        return FALLBACK;
      }
    }
    load().then((data) => {
      const years = [...new Set((data.entries || []).map((r) => String(r.date).slice(0, 4)))].sort();
      if (!years.length) years.push(String(new Date().getFullYear()));
      const startYear = Number(params.get("year")) || Number(years[years.length - 1]);
      const box = document.getElementById("years");
      years.forEach((y) => {
        const b = document.createElement("button");
        b.textContent = y;
        if (Number(y) === startYear) b.className = "on";
        b.addEventListener("click", () => {
          [...box.children].forEach((x) => x.classList.remove("on"));
          b.classList.add("on");
          paint(data, Number(y));
        });
        box.appendChild(b);
      });
      paint(data, startYear);
    });
  </script>
</body>
</html>

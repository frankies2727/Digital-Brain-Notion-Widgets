<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quote of the Day</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: #141414;
      color: #f5f5f5;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      overflow: hidden;
    }
    .stars { position: fixed; inset: 0; pointer-events: none; }
    .star {
      position: absolute;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 0 4px #fff, 0 0 10px rgba(255,255,255,.7);
    }
    .wrap {
      position: relative;
      z-index: 1;
      width: 100%; height: 100%;
      display: grid;
      place-items: center;
      padding: 7%;
    }
    .card { max-width: 560px; width: 100%; text-align: left; }
    .kicker {
      font-size: clamp(10px, 2.3vmin, 12px);
      letter-spacing: .18em;
      text-transform: uppercase;
      opacity: .7;
      margin-bottom: 14px;
    }
    .quote {
      font-size: clamp(18px, 4.4vmin, 28px);
      line-height: 1.35;
      font-weight: 500;
      letter-spacing: -.01em;
    }
    .quote::before { content: "“"; }
    .quote::after { content: "”"; }
    .who {
      margin-top: 18px;
      font-size: clamp(13px, 2.8vmin, 16px);
      letter-spacing: .02em;
    }
    .who b { font-weight: 650; }
    .who span {
      display: block;
      margin-top: 4px;
      font-size: .86em;
      opacity: .65;
    }
  </style>
</head>

    const POOL = QUOTES;

    const sky = document.getElementById("stars");
    for (let i = 0; i < 220; i++) {
      const s = document.createElement("i");
      s.className = "star";
      const size = Math.random() < 0.1 ? 2.4 : 1.3;
      s.style.width = size + "px";
      s.style.height = size + "px";
      s.style.left = Math.random() * 100 + "%";
      s.style.top = Math.random() * 100 + "%";
      s.style.opacity = Math.random() < 0.3 ? 1 : 0.75;
      sky.appendChild(s);
    }

    function todayKey(date) {
      return new Intl.DateTimeFormat("en-CA", {
        timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit"
      }).format(date);
    }

    function hash(str) {
      let h = 2166136261;
      for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return Math.abs(h);
    }

    function paint(key) {
      const h = hash(key + ":hue") % 360;
      const s = 42 + (hash(key + ":sat") % 38);
      const l = 8 + (hash(key + ":lit") % 12);
      document.body.style.background = "hsl(" + h + " " + s + "% " + l + "%)";
    }

    function cached(day) {
      try {
        const raw = localStorage.getItem("qotd-local:" + day);
        return raw ? JSON.parse(raw) : null;
      } catch (e) {
        return null;
      }
    }

    function save(day, payload) {
      try {
        localStorage.setItem("qotd-local:" + day, JSON.stringify(payload));
      } catch (e) {}
    }

    function render() {
      const key = todayKey(new Date());
      const hit = cached(key);
      const q = (hit && hit.t && hit.a) ? hit : POOL[hash(key) % POOL.length];
      if (!hit || hit.t !== q.t) save(key, q);
      document.getElementById("quote").textContent = q.t;
      document.getElementById("who").innerHTML = "<b>" + q.a + "</b><span>" + q.n + "</span>";
      paint(key);
    }

    render();
  </script>
</body>
